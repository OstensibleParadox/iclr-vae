run_group: smoke
device: cuda
hardware: A100
dtype: float32
amp: false
tf32: false
deterministic: true
seeds: [0]

deterministic_backend_settings:
  - "torch.backends.cuda.matmul.allow_tf32 = False"
  - "torch.backends.cudnn.allow_tf32 = False"
  - "torch.backends.cudnn.benchmark = False"
  - "torch.use_deterministic_algorithms(True, warn_only=True)"

controlled_spectra:
  dimensions: [32, 64, 128]
  regimes: [S1, S2_not_S1, outside_S2]
  regime_parameters:
    S1: {exponent_alpha: 1.25, amplitude: 1.0}
    S2_not_S1: {exponent_alpha: 0.75, amplitude: 1.0}
    outside_S2: {exponent_alpha: 0.35, amplitude: 1.0}

elbo_toy:
  dimensions: [64]
  batch_size: 64
  num_probe_vectors: 8
  epochs: 3
  learning_rate: 0.03
  max_beta: 0.95
  init_scale: 0.45
  init_alpha: 0.05
  target_scale: 0.72
  target_alpha: 0.10
  alpha_filter: 0.60
  branches: [ordinary_kl, cf_kl, cf_filtered, cf_plus_half_trace, cf_plus_one_trace, cf_minus_half_trace]

fno:
  resolutions: [32]
  seeds: [0]
  train_size: 4
  val_size: 2
  epochs: 2
  batch_size: 2
  width: 8
  learning_rate: 0.002
  weight_decay: 0.0
  max_beta: 0.45
  alpha_filter: 1.25
  noise_lr_penalty_weight: 0.001
  jacobi_iterations: 8
  jacobi_relaxation: 0.8
  modes_divisor: 4
  t2_norm_mode: per_mode
  aggregate_resolutions: [32]
  branches: [ordinary_noise, cf_schatten_filtered]
  metrics: [validation_relative_l2, training_loss, gradient_norm, t2_raw, t2_normalized, high_frequency_energy_ratio]

sdvae:
  model: stabilityai/sd-vae-ft-mse
  resolutions: [64]
  input_types: [white_noise]
  compute_object: gram_spectrum
  jacobian_method: vjp_row_chunks
  save_jacobian_shards: true
  build_gram: true
  eigvalsh_gram: true
  fit_power_law_on: covariance_eigenvalues
  hutchinson_probe_counts: [2]
  hutchinson_probes: 2
  row_chunk_size: 4
  bootstrap_samples: 10
  hutchinson_eps: 0.001
  fit_start_fraction: 0.05
  fit_end_fraction: 0.80
