run_group: a100_final
device: cuda
hardware: A100
dtype: float32
amp: false
tf32: false
deterministic: true
seeds: [0, 1, 2]

deterministic_backend_settings:
  - "torch.backends.cuda.matmul.allow_tf32 = False"
  - "torch.backends.cudnn.allow_tf32 = False"
  - "torch.backends.cudnn.benchmark = False"
  - "torch.use_deterministic_algorithms(True, warn_only=True)"

controlled_spectra:
  dimensions: [256, 1024, 4096, 16384]
  regimes: [S1, S2_not_S1, outside_S2]
  regime_parameters:
    S1: {exponent_alpha: 1.25, amplitude: 1.0}
    S2_not_S1: {exponent_alpha: 0.75, amplitude: 1.0}
    outside_S2: {exponent_alpha: 0.35, amplitude: 1.0}

elbo_toy:
  dimensions: [256, 1024, 4096, 16384]
  batch_size: 512
  num_probe_vectors: 64
  epochs: 80
  learning_rate: 0.03
  max_beta: 0.95
  init_scale: 0.45
  init_alpha: 0.05
  target_scale: 0.72
  target_alpha: 0.10
  alpha_filter: 0.60
  branches:
    - ordinary_kl
    - cf_kl
    - cf_filtered
    - cf_plus_half_trace
    - cf_plus_one_trace
    - cf_minus_half_trace

fno:
  resolutions: [64, 128, 256]
  seeds: [0, 1, 2]
  train_size: 64
  val_size: 16
  epochs: 20
  batch_size: 4
  width: 24
  learning_rate: 0.002
  weight_decay: 0.0
  max_beta: 0.45
  alpha_filter: 1.25
  noise_lr_penalty_weight: 0.001
  jacobi_iterations: 150
  jacobi_relaxation: 0.8
  modes_divisor: 4
  t2_norm_mode: per_mode
  aggregate_resolutions: [128, 256]
  branches:
    - ordinary_noise
    - cf_unfiltered
    - cf_schatten_filtered
  metrics:
    - validation_relative_l2
    - training_loss
    - gradient_norm
    - t2_raw
    - t2_normalized
    - high_frequency_energy_ratio

sdvae:
  model: stabilityai/sd-vae-ft-mse
  resolutions: [64, 128, 256, 512]
  input_types:
    - white_noise
    - constant_gray
    - structured_sinusoidal
  compute_object: gram_spectrum
  jacobian_method: vjp_row_chunks
  save_jacobian_shards: true
  build_gram: true
  eigvalsh_gram: true
  fit_power_law_on: covariance_eigenvalues
  hutchinson_probe_counts: [10, 25, 50, 100]
  hutchinson_probes: 100
  row_chunk_size: 128
  bootstrap_samples: 500
  hutchinson_eps: 0.001
  fit_start_fraction: 0.05
  fit_end_fraction: 0.80
